site:
  title: mzIdentML
  url: https://hupo-psi.github.io/mzIdentML
  start_page: mzidentml::index.adoc
  keys:
    site_home_url: https://hupo-psi.github.io/mzIdentML
    site_home_label: mzIdentML Home
    header_doc_title: mzIdentML Specification
    github_profile_url: https://github.com/HUPO-PSI/mzIdentML

content:
  sources:
    - url: .
      # Every version is a v* branch: released versions (e.g. v1.3.0) and the
      # version in development (e.g. v1.3.1-dev). Each branch's antora.yml sets
      # its version, so no two v* branches may declare the same one.
      # (./build-site.sh previews the current branch only; see that script.)
      branches: ['v*']
      # Read each branch from its git worktree when it has one (the main checkout
      # or a linked worktree), including untracked files. CI (prepare-versions.sh)
      # gives every v* branch a worktree holding its freshly built PDF/DOCX.
      worktrees: true
      start_path: docs/mzidentml
      edit_url: 'https://github.com/HUPO-PSI/mzIdentML/edit/{refname}/{path}'

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./docs/supplemental-ui

antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true

# Fail the build on error-level messages rather than publishing a broken page.
# Without this a missing include or download (e.g. an absent partial or PDF on a
# v* branch) is only logged, and the page is published broken with a green build.
runtime:
  log:
    failure_level: error

output:
  dir: ./build/site
