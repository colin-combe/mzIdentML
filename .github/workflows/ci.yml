name: Spec Build Workflow
# Builds the standalone specification documents (PDF/HTML/DOCX/XML) and the
# Antora documentation site, then publishes the site to GitHub Pages.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_call:

env:
  DOC_IN: "${{ github.workspace }}/specification_document/specdoc1_3/asciidoc"
  DOC_OUT: "${{ github.workspace }}/specification_document-releases/specdoc1_3/output"
  DOC_FILE: 'mzidentml.adoc'
  RELEASE_DIR: '1_3-mzidentml-release'

jobs:
  # ---------------------------------------------------------------------------
  # Build the standalone specification documents (PDF/HTML/DOCX/XML) with
  # asciidoctor + pandoc, exactly as before. These are the downloadable release
  # artifacts, and they are overlaid onto the published Antora site so that the
  # existing hupo-psi.github.io/mzIdentML/*.pdf download links keep working.
  # ---------------------------------------------------------------------------
  build-spec:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set build timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      
      - name: Pull Asciidoctor Docker image
        run: docker pull asciidoctor/docker-asciidoctor:1
      
      - name: Build specification documents
        run: |
          ./build-docs.sh \
            -i "$DOC_IN" \
            -o "$DOC_OUT" \
            -c "$GITHUB_SHA" \
            -d "$BUILD_DATE" \
            -f "$DOC_FILE"
        shell: bash

      - name: Build crosslinking extension doc
        run: ./build-docs.sh -i "$DOC_IN" -o "$DOC_OUT" -c "$GITHUB_SHA" -d "$BUILD_DATE" -f "crosslinking_ext.adoc" -r
        shell: bash

      - name: Prepare output directory
        run: |
          mkdir -p output/$RELEASE_DIR/img
          cp -v -R $DOC_OUT/* output/$RELEASE_DIR/
          cp -v -R $DOC_OUT/img/* output/$RELEASE_DIR/img/
          cp -v -R docs/* output/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: specification-documents
          path: |
            output/${{ env.RELEASE_DIR }}/*.pdf
            output/${{ env.RELEASE_DIR }}/*.html
            output/${{ env.RELEASE_DIR }}/*.docx
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Build the Antora documentation site and overlay the standalone documents +
  # generated schema HTML at the site root.
  # ---------------------------------------------------------------------------
  build-docs:
    name: Build Antora documentation
    needs: build-spec
    # Skip in workflow_call context — release.yml has its own publish-site job.
    # Also skip when a PR is closed without merging (no deployment value).
    if: github.event_name != 'workflow_call' && !(github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --all

      - name: Create local tracking branches for existing release versions
        run: |
          for branch in $(git branch -r | grep 'origin/v' | sed 's|.*origin/||'); do
            git branch "$branch" "origin/$branch" 2>/dev/null || true
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Antora and extensions
        run: npm ci

      - name: Build Antora site
        env:
          ANTORA_EDIT_BRANCH: main
        run: |
          npx antora antora-playbook.yml \
            --attribute "commit-hash=${{ github.sha }}" \
            --attribute "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Download standalone specification documents
        uses: actions/download-artifact@v8
        with:
          name: spec-release
          path: spec-release

      - name: Overlay standalone documents and schema HTML at site root
        run: |
          # Downloadable documents referenced from the site's spec/schema pages.
          cp -v spec-release/mzidentml.* spec-release/crosslinking_ext.* build/site/ 2>/dev/null || true
          cp -R spec-release/schema_html build/site/schema_html

      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/

  deploy-docs:
    name: Deploy documentation to GitHub Pages
    needs: build-docs
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
