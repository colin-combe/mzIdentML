name: Spec Build Workflow
# Builds the Antora documentation site from every v* branch (released versions,
# e.g. v1.3.0, and the version in development, e.g. v1.3.1-dev), each with its
# own specification PDF/DOCX, then publishes it to GitHub Pages.
#
# A push to any v* branch rebuilds and redeploys the whole site. A pull request
# into a v* branch builds the site with the PR's changes in place of that branch.
on:
  push:
    branches:
      - 'v*'
  pull_request:
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fail if the committed Antora partials differ from what gen-docs.sh produces
  # from the specification sources, i.e. a partial was edited by hand or a
  # source was edited without regenerating.  The partials must be committed
  # because Antora reads them from each v* branch, where gen-docs.sh never runs.
  #
  # Only --spec and --crosslinking are checked for now: the --changes documents
  # need frozen 1.3.0 / 1.0.0 baseline files that are not in the repo yet.  Once
  # they are, replace the two runs below with a plain ./gen-docs.sh.
  # ---------------------------------------------------------------------------
  check-partials:
    name: Check generated partials are up to date
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate partials
        run: |
          ./gen-docs.sh --spec
          ./gen-docs.sh --crosslinking
        shell: bash

      - name: Compare with committed partials
        run: |
          partials=docs/mzidentml/modules/developers/partials
          if [ -n "$(git status --porcelain -- "$partials")" ]; then
            echo "::error::Generated partials are out of date with the specification sources."
            echo "Edit the sources under specification_document/specdoc1_3/asciidoc/, run ./gen-docs.sh and commit the result."
            git status --short -- "$partials"
            git diff -- "$partials"
            exit 1
          fi
          echo "Partials are up to date."
        shell: bash

  # ---------------------------------------------------------------------------
  # Build the specification PDF/DOCX of every v* branch and the Antora site.
  # ---------------------------------------------------------------------------
  build-site:
    name: Build documentation site
    needs: check-partials
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create local branches for all v* branches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is checked out as a detached merge commit. Name it
          # after the branch it targets, so the site shows the PR's changes as
          # that version (Antora reads the current branch from the worktree).
          if [ -n "$BASE_REF" ]; then
            git checkout -B "$BASE_REF"
          fi
          for branch in $(git branch -r --list 'origin/v*' --format='%(refname:lstrip=3)'); do
            git branch "$branch" "origin/$branch" 2>/dev/null || true
          done
          git branch --list 'v*'

      - name: Install dependencies
        # librsvg2-bin provides rsvg-convert, which pandoc shells out to when
        # rasterising SVG figures for DOCX output.  Without it the SVG is
        # embedded with no PNG fallback and renders blank outside recent Word.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc librsvg2-bin

      - name: Pull Asciidoctor Docker image
        run: docker pull asciidoctor/docker-asciidoctor:1

      - name: Build each version's specification PDF/DOCX
        run: ./prepare-versions.sh
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Antora and extensions
        run: npm ci

      - name: Build Antora site
        run: npx antora antora-playbook.yml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/

  deploy-site:
    name: Deploy documentation to GitHub Pages
    needs: build-site
    # A merged PR also triggers a push to its v* branch, so deploying on push
    # covers it. The github-pages environment must allow deployments from v*
    # branches (Settings → Environments → github-pages → Deployment branches).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
