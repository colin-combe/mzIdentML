name: Spec Doc Release Workflow
# Publishing a GitHub release whose tag is a plain version X.Y.Z (e.g. 1.3.1, no
# leading 'v', so tags never share a name with the v* documentation branches):
#
#   1. validates the examples;
#   2. creates the documentation branch vX.Y.Z from the tagged commit, with
#      version 'X.Y.Z' and no prerelease in docs/mzidentml/antora.yml;
#   3. replaces the development branch vX.Y.Z-dev, if there is one, with
#      vX.Y.(Z+1)-dev: same history, version bumped, prerelease -dev. Both
#      vX.Y.Z and vX.Y.Z-dev would otherwise declare version X.Y.Z, which
#      Antora rejects;
#   4. rebuilds and deploys the site through ci.yml (all v* branches, each
#      with its own PDF/DOCX, built by prepare-versions.sh; nothing is committed).
#
# Releases with any other tag (e.g. the validator's mzIdentMLValidator_GUI_*)
# are ignored.
#
# Branch pushes are atomic: either all of step 2 and 3 happens or none.
#
# Required settings:
#   - Settings → Pages: source "GitHub Actions".
#   - Settings → Environments → github-pages: deployment branches and tags must
#     allow the v* branches and the X.Y.Z release tags.
#   - Branch protection, if any, must let GitHub Actions create v* branches and
#     delete v*-dev branches.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-tag:
    name: Check release tag
    runs-on: ubuntu-24.04
    outputs:
      is_spec: ${{ steps.check.outputs.is_spec }}
    steps:
      - name: Is the tag a specification version (X.Y.Z)?
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_spec=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_spec=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Tag '${TAG}' is not X.Y.Z, so no documentation version is released."
          fi

  # Local references run the reusable workflows from the released commit.
  test-examples-workflow:
    needs: check-tag
    if: needs.check-tag.outputs.is_spec == 'true'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  create-doc-branches:
    name: Create documentation version branches
    # Do not publish documentation for a release whose examples fail validation.
    needs: [check-tag, test-examples-workflow]
    if: needs.check-tag.outputs.is_spec == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create vX.Y.Z and replace vX.Y.Z-dev with vX.Y.(Z+1)-dev
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ANTORA=docs/mzidentml/antora.yml
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          REL="v${VERSION}"
          DEV="v${VERSION}-dev"
          NEXT_DEV="v${NEXT}-dev"

          remote_has() { git ls-remote --exit-code --heads origin "refs/heads/$1" > /dev/null; }

          if remote_has "${REL}"; then
            echo "::error::Branch ${REL} already exists; ${VERSION} has already been released."
            exit 1
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Set the component version in antora.yml: <version> [<prerelease>].
          set_version() {
            sed -i -E "s/^version:.*/version: '$1'/" "${ANTORA}"
            sed -i '/^prerelease:/d' "${ANTORA}"
            if [ -n "${2:-}" ]; then
              sed -i "/^version:/a prerelease: $2" "${ANTORA}"
            fi
            git add "${ANTORA}"
          }

          # The released version: the tagged commit, as a stable version.
          git switch --quiet -c "${REL}" "${GITHUB_SHA}"
          set_version "${VERSION}"
          # Nothing to commit if the tagged commit already declares this version.
          git diff --cached --quiet || git commit -m "release: ${VERSION}"
          PUSH=("refs/heads/${REL}:refs/heads/${REL}")

          # The development version: vX.Y.Z-dev continues as vX.Y.(Z+1)-dev,
          # keeping any commits made after the tag.
          if remote_has "${DEV}"; then
            if remote_has "${NEXT_DEV}"; then
              echo "::error::Both ${DEV} and ${NEXT_DEV} exist. Merge or delete one of them, then re-run this workflow."
              exit 1
            fi
            git switch --quiet -c "${NEXT_DEV}" "origin/${DEV}"
            set_version "${NEXT}" "-dev"
            git commit -m "Start ${NEXT} development (continues ${DEV})"
            PUSH+=("refs/heads/${NEXT_DEV}:refs/heads/${NEXT_DEV}" ":refs/heads/${DEV}")
          else
            echo "::notice::No ${DEV} branch, so no development branch is replaced."
          fi

          git push --atomic origin "${PUSH[@]}"
          echo "Pushed: ${PUSH[*]}"

  # The pushes above were made with GITHUB_TOKEN, which does not trigger ci.yml's
  # push event, so call it directly. Its checkout fetches the new branches.
  publish-site:
    needs: create-doc-branches
    uses: ./.github/workflows/ci.yml
    # A called workflow may not request more than the caller grants.
    permissions:
      contents: read
      pages: write
      id-token: write
