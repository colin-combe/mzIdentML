name: mzidentml
version: '1.3.0'
title: mzIdentML
nav:
  - modules/ROOT/nav.adoc
  - modules/users/nav.adoc
  - modules/developers/nav.adoc
  - modules/validation/nav.adoc
asciidoc:
  attributes:
    # Base names of the specification PDF/DOCX attachments (modules/ROOT/attachments/),
    # built by scripts/build-spec-docs.sh from the .adoc of the same name. They are not committed:
    # CI (scripts/prepare-versions.sh) and scripts/build-site.sh (when missing) build them.
    # Linked as xref:ROOT:attachment${spec-basename}.pdf[].
    spec-basename: mzidentml
    xl-basename: crosslinking_ext
    # Replaced with this branch's last commit by scripts/prepare-versions.sh in CI.
    commit-hash: 'local'
    build-date: 'local build'
