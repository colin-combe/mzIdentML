name: mzidentml
version: '1.3.0'
title: mzIdentML
nav:
  - modules/ROOT/nav.adoc
  - modules/users/nav.adoc
  - modules/developers/nav.adoc
  - modules/validation/nav.adoc
asciidoc:
  attributes:
    # The specification pages are standalone documents with :toc: left for their
    # PDF/DOCX. The site has its own page contents panel, so no in-page TOC here.
    toc: ~
    # Base names of the specification PDF/DOCX attachments (modules/ROOT/attachments/),
    # built by scripts/build-spec-docs.sh from developers/pages/specification.adoc and
    # crosslinking.adoc. Include the document's version. They are not committed:
    # CI (scripts/prepare-versions.sh) and scripts/build-site.sh (when missing) build them.
    # Linked as xref:ROOT:attachment${spec-basename}.pdf[].
    spec-basename: mzidentml-1.3.0
    xl-basename: crosslinking_ext-1.0.0
    # Replaced with this branch's last commit by scripts/prepare-versions.sh in CI.
    commit-hash: 'local'
    build-date: 'local build'
